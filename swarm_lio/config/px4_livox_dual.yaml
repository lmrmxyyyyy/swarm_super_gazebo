common:
    time_offset_lidar_imu: 0.0

multiuav:
    cluster_extraction_in_predict_region: true
    inten_threshold: 200
    min_high_inten_cluster_size: 2
    min_cluster_size: 3
    predict_region_radius: 0.5
    temp_predict_region_radius: 0.5
    traj_matching_start_thresh: 100.0
    ave_match_error_thresh: 0.2
    pos_num_in_traj: 300
    reset_tracker_thresh: 5.0
    valid_cluster_size_thresh: 0.6
    valid_cluster_dist_thresh: 0.6
    mutual_observe_noise: 0.001
    frame_num_in_sliding_window: 1
    actual_uav_num: 2
    degeneration_thresh: 10

imu_propagate:
    enable: false
    topic: "lidar_slam/imu_propagate"
    filter_acc_en: false

preprocess:
    # Keep SIM so the two estimators share their decentralized swarm topics.
    # The workspace adaptation still consumes livox_ros_driver2/CustomMsg.
    lidar_type: 6
    feature_extract_en: false
    scan_line: 4
    blind: 0.2

calibration:
    cut_frame_en: false
    cut_frame_num: 1
    accumulate_frame_en: false
    original_frequency: 30
    gravity_align_enable: false
    gravity_align_time: 10
    PX4_R_I: [0.0, 0.0, 0.0]
    PX4_p_I: [0.0, 0.0, 0.0]
    level_horizon: [0.0, 0.0, 0.0]

mapping:
    imu_en: true
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    det_range: 100.0
    # LiDAR pose in the dedicated Gazebo IMU frame.
    LI_extrinsic_T: [-0.011, -0.02329, 0.044412]
    LI_extrinsic_R: [1, 0, 0,
                     0, 1, 0,
                     0, 0, 1]
    point_filter_num: 3
    max_iteration: 3
    filter_size_surf: 0.3
    filter_size_map: 0.3
    cube_side_length: 1000

publish:
    path_en: true
    scan_publish_en: true
    dense_publish_en: false
    scan_bodyframe_pub_en: false

pcd_save:
    pcd_save_en: false
    pcd_resolution: 0.1
    interval: -1
